[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-glm"
version = "0.1.0"
description = "Open multimodal conversational assistant training and serving stack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Conversational GLM Contributors"}]
dependencies = [
  "torch>=2.3", "transformers>=4.44", "accelerate>=0.33", "datasets>=2.20", "tokenizers>=0.19",
  "safetensors>=0.4", "sentencepiece>=0.2", "fastapi>=0.112", "uvicorn[standard]>=0.30",
  "pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "aiosqlite>=0.20",
  "python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7", "python-multipart>=0.0.9",
  "httpx>=0.27", "websockets>=12", "numpy>=1.26", "scipy>=1.13", "soundfile>=0.12",
  "librosa>=0.10", "Pillow>=10", "opencv-python-headless>=4.10", "scikit-learn>=1.5",
  "faiss-cpu>=1.8", "onnx>=1.16", "onnxruntime>=1.18", "pyyaml>=6.0", "rich>=13.7",
  "prometheus-client>=0.20", "psutil>=6.0", "structlog>=24.2", "tenacity>=8.5", "email-validator>=2.2", "asyncpg>=0.29", "pypdf>=4.3"
]

[project.optional-dependencies]
train = ["deepspeed>=0.15", "wandb>=0.17", "tensorboard>=2.17", "peft>=0.12", "trl>=0.9", "evaluate>=0.4", "bitsandbytes>=0.43"]
video = ["diffusers>=0.30", "av>=12.3", "imageio[ffmpeg]>=2.35", "mediapipe>=0.10"]
speech = ["TTS>=0.22"]
export = ["onnxsim>=0.4", "optimum>=1.21", "gguf>=0.10"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "training*", "models*", "database*", "audio*", "video*", "vision*", "emotion*", "memory*", "rag*", "inference*", "evaluation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
