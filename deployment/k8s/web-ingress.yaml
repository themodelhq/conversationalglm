apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glm-web
  namespace: conversational-glm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls: [{hosts: [assistant.example.com], secretName: glm-web-tls}]
  rules:
    - host: assistant.example.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: glm-web, port: {number: 80}}}}]
