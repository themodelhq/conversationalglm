apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: glm-api
  namespace: conversational-glm
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: glm-api}
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
