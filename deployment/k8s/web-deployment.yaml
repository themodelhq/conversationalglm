apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-web
  namespace: conversational-glm
spec:
  replicas: 2
  selector:
    matchLabels: {app: glm-web}
  template:
    metadata:
      labels: {app: glm-web}
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/conversational-glm-web:latest
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: "100m", memory: 128Mi}
            limits: {cpu: "500m", memory: 256Mi}
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 10}
