apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glm-api
  namespace: conversational-glm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls: [{hosts: [api.assistant.example.com], secretName: glm-api-tls}]
  rules:
    - host: api.assistant.example.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: glm-api, port: {number: 80}}}}]
